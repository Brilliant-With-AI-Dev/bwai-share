name: Validate static site

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate HTML entry points
        shell: bash
        run: |
          set -euo pipefail

          test -f index.html || {
            echo "Missing root index.html" >&2
            exit 1
          }

          while IFS= read -r -d '' file; do
            test -s "$file" || {
              echo "Empty HTML file: $file" >&2
              exit 1
            }

            grep -Eiq '<!doctype[[:space:]]+html|<html([[:space:]>])' "$file" || {
              echo "Missing HTML document marker: $file" >&2
              exit 1
            }
          done < <(git ls-files -z -- 'index.html' '*/index.html')
