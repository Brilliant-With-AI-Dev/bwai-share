<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Content unavailable</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17213a;
        --muted: #64708a;
        --line: #dbe1ec;
        --paper: #ffffff;
        --canvas: #f5f7fb;
        --accent: #2458b8;
        --accent-dark: #173f8a;
      }

      * { box-sizing: border-box; }

      html, body { min-height: 100%; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 16%, rgba(36, 88, 184, 0.08), transparent 34%),
          radial-gradient(circle at 88% 82%, rgba(23, 33, 58, 0.06), transparent 32%),
          var(--canvas);
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 680px);
        padding: clamp(32px, 7vw, 64px);
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 24px 60px rgba(23, 33, 58, 0.08);
      }

      .wordmark {
        margin: 0 0 48px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .wordmark span { color: var(--accent); }

      .eyebrow {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 13ch;
        margin: 0 0 22px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(38px, 7vw, 58px);
        font-weight: 500;
        letter-spacing: -0.035em;
        line-height: 1.03;
      }

      p {
        max-width: 52ch;
        margin: 0;
        color: var(--muted);
        font-size: clamp(16px, 2.4vw, 19px);
        line-height: 1.65;
      }

      a {
        color: var(--accent);
        font-weight: 650;
        text-decoration-thickness: 1.5px;
        text-underline-offset: 4px;
      }

      a:hover { color: var(--accent-dark); }

      a:focus-visible {
        outline: 3px solid rgba(36, 88, 184, 0.28);
        outline-offset: 4px;
        border-radius: 2px;
      }

      @media (max-width: 480px) {
        body { padding: 14px; }
        main { border-radius: 14px; }
        .wordmark { margin-bottom: 38px; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="wordmark" aria-label="TheMirror.ai">TheMirror<span>.ai</span></div>
      <p class="eyebrow">Content notice</p>
      <h1>Currently unavailable.</h1>
      <p>
        This content is not currently available. If you have any questions,
        please email
        <a href="mailto:nish@brilliantwith.ai?subject=Question%20about%20Edelman%20APAC%20content&amp;body=Hi%20Nish%2C%0D%0A%0D%0AI%20have%20a%20question%20about%20the%20Edelman%20APAC%20content%20that%20is%20currently%20unavailable.%0D%0A%0D%0AMy%20question%3A%20%0D%0A%0D%0AThanks%2C%0D%0A">nish@brilliantwith.ai</a>.
      </p>
    </main>
  </body>
</html>
